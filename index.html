<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>IndaiaFibra - Avaliação</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: black;
      color: white;
    }

    #spaceCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
      z-index: 0;
      transition: transform 8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    #snowCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 102;
      pointer-events: none;
    }

    .nebula {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(100, 150, 255, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255, 100, 150, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 50% 10%, rgba(150, 100, 255, 0.2) 0%, transparent 60%);
      z-index: 1;
      opacity: 0.6;
      animation: nebulaPulse 20s ease-in-out infinite;
    }

    .hyperdrive {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(to bottom, rgba(32, 41, 158, 0.6) 0%, rgba(255, 255, 255, 0.15) 50%, rgba(179, 14, 14, 0.95) 100%),
        repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.05) 10px, rgba(255,255,255,0.05) 20px);
      opacity: 0;
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.5s ease-in;
    }

    img {
      width: 150px;
      transform: translateY(100vh) scale(0.7);
      animation: entradaLogo 3.5s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
      filter: drop-shadow(0 0 30px rgba(21, 94, 183, 1)) brightness(1.1) saturate(1.1) contrast(1.2);
      z-index: 5;
      position: relative;
      cursor: pointer; /* Adicionado para indicar que o logo é clicável */
      transition: transform 0.2s ease; /* Suave hover no logo */
    }

    img:hover {
      transform: scale(1.05); /* Efeito de hover no logo */
    }

    .flare {
      position: absolute;
      width: 200px;
      height: 200px;
      background: 
        radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 200, 100, 0.6) 30%, transparent 70%),
        radial-gradient(ellipse, rgba(100, 200, 255, 0.4) 0%, transparent 50%);
      opacity: 0;
      z-index: 4;
      animation: flareEffect 0.5s ease-out forwards;
      pointer-events: none;
      border-radius: 50%;
    }

    p {
      font-size: 1.6rem;
      margin: 10px 0;
      opacity: 0;
      z-index: 5;
      position: relative;
      letter-spacing: 2px;
      text-align: center;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    #text1 { animation: textoAparece 1s ease-out 2.5s forwards; /* Duração reduzida para 1s */ }
    #text2 { animation: textoAparece 1s ease-out 3.5s forwards; /* Ajustado delay para 3.5s, duração 1s */ font-size: 2rem; font-weight: 700; text-shadow: 0 0 20px rgba(21, 94, 183, 0.8); }

    .button-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
      opacity: 0;
      animation: buttonAparece 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) 4s forwards; /* Duração 0.8s, easing com bounce para zoom out quicando */
      z-index: 5;
    }

    button {
      padding: 12px 24px;
      font-size: 1.2rem;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      background: linear-gradient(45deg, #155EB7, #0d47a1);
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(21, 94, 183, 0.3), inset 0 1px 0 rgba(255,255,255,0.2);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      min-width: 200px;
      position: relative;
      overflow: hidden;
    }

    /* Estilo específico para o botão de gorjeta - mais simples e acolhedor */
    #tipButton {
      display: none; /* Botão oculto permanentemente */
      background: linear-gradient(45deg, #FF0707, #D3CDC5);
      box-shadow: 0 4px 15px rgba(40, 36, 36, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    #tipButton:hover {
      box-shadow: 0 8px 25px rgba(255, 193, 7, 0.4);
      transform: translateY(-2px) scale(1.05);
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    button:hover::before {
      left: 100%;
    }

    button:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 8px 25px rgba(21, 94, 183, 0.4), inset 0 1px 0 rgba(255,255,255,0.3);
    }

    button:active {
      transform: translateY(0) scale(0.98);
    }

    #evaluateButton {
      background: linear-gradient(45deg, #28a745, #20c997);
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
    }

    #evaluateButton:hover {
      box-shadow: 0 8px 25px rgba(40, 167, 69, 0.4);
    }

    #playButton {
      display: none; /* Botão "Jogar" oculto permanentemente */
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(221, 221, 221, 1);
      opacity: 0;
      z-index: 10;
      pointer-events: none;
      transition: opacity 1s ease-in;
    }

    #gameOverOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at center, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.95) 100%),
        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="%23ff0000" stop-opacity="0.1"/><stop offset="100%" stop-color="%23ff0000" stop-opacity="0"/></radialGradient></defs><circle cx="50" cy="50" r="50" fill="url(%23g)"/></svg>') center/cover;
      z-index: 20;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      font-family: 'Poppins', sans-serif;
      gap: 20px;
      text-align: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.8s ease-out;
    }

    #gameOverOverlay h2 {
      font-size: 2.5rem;
      margin: 0 0 10px;
      font-weight: 700;
      text-shadow: 0 0 20px rgba(255,0,0,0.8);
      letter-spacing: 2px;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.6s ease-out;
    }

    #gameOverOverlay p {
      font-size: 1.8rem;
      margin: 0 0 20px;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.8s ease-out;
    }

    #gameOverOverlay.show h2,
    #gameOverOverlay.show p {
      opacity: 1;
      transform: scale(1);
    }

    .score {
      color: #FFD700;
      text-shadow: 0 0 15px #FFD700;
      font-weight: 700;
      font-size: 1.2em;
    }

    #top5 {
      list-style: none;
      padding: 0;
      margin: 10px 0;
      max-width: 300px;
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.5s ease-out;
    }

    #top5 li {
      font-size: 1.2rem;
      margin: 8px 0;
      padding: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      text-align: left;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
      opacity: 0;
      transform: translateX(-30px) translateY(20px);
      transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    #top5.animate-ranking {
      opacity: 1;
      transform: translateY(0);
    }

    #top5.animate-ranking li:nth-child(1) {
      transition-delay: 0.2s;
      opacity: 1;
      transform: translateX(0) translateY(0);
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    }

    #top5.animate-ranking li:nth-child(2) {
      transition-delay: 0.3s;
      opacity: 1;
      transform: translateX(0) translateY(0);
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    }

    #top5.animate-ranking li:nth-child(3) {
      transition-delay: 0.4s;
      opacity: 1;
      transform: translateX(0) translateY(0);
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    }

    #top5.animate-ranking li:nth-child(4) {
      transition-delay: 0.5s;
      opacity: 1;
      transform: translateX(0) translateY(0);
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    }

    #top5.animate-ranking li:nth-child(5) {
      transition-delay: 0.6s;
      opacity: 1;
      transform: translateX(0) translateY(0);
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    }

    #top5 li:nth-child(1)::before {
      content: '🥇 ';
      font-size: 1.1em;
    }

    #top5 li:nth-child(2)::before {
      content: '🥈 ';
      font-size: 1.1em;
    }

    #top5 li:nth-child(3)::before {
      content: '🥉 ';
      font-size: 1.1em;
    }

    #nameInput {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin: 10px 0;
    }

    #nameInput input {
      padding: 10px;
      font-size: 1rem;
      border: none;
      border-radius: 15px;
      width: 200px;
      max-width: 80%;
      background: rgba(255, 255, 255, 0.9);
      color: black;
      font-family: 'Poppins', sans-serif;
    }

    #nameInput button {
      padding: 10px 20px;
      font-size: 1rem;
      min-width: auto;
      width: auto;
    }

    .success-message {
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
      color: #00ff00;
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
      text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
      margin: 10px 0;
    }

    .success-message.show {
      opacity: 1;
      transform: scale(1);
    }

    #gameOverOverlay button {
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: 600;
      background: linear-gradient(45deg, #155EB7, #0d47a1);
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      margin: 0 5px;
      min-width: auto;
      box-shadow: 0 4px 15px rgba(21, 94, 183, 0.3);
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(20px);
    }

    #gameOverOverlay.show button {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.8s;
    }

    #gameOverOverlay button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(21, 94, 183, 0.4);
    }

    #gameOverOverlay button:nth-child(3) {
      background: linear-gradient(45deg, #6c757d, #495057);
      box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3);
    }

    #gameOverOverlay button:nth-child(3):hover {
      box-shadow: 0 6px 20px rgba(108, 117, 125, 0.4);
    }

    #gameOverOverlay button:nth-child(4) {
      background: linear-gradient(45deg, #28a745, #20c997);
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
    }

    #gameOverOverlay button:nth-child(4):hover {
      box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
    }

    @media (max-width: 768px) {
      .button-container {
        flex-direction: column;
        gap: 10px;
      }

      button {
        font-size: 1.4rem;
        padding: 15px 30px;
        min-width: 250px;
      }

      #playButton {
        display: none; /* Mantido oculto em mobile também */
      }

      #tipButton {
        display: none; /* Oculto em mobile também */
        font-size: 1.4rem;
        padding: 15px 30px;
        min-width: 250px;
      }

      #gameOverOverlay button {
        font-size: 1.3rem;
        padding: 15px 30px;
        margin: 5px 0;
        width: 80%;
      }

      #gameOverOverlay {
        gap: 15px;
        padding: 10px;
      }

      #gameOverOverlay h2 {
        font-size: 2rem;
      }

      #gameOverOverlay p {
        font-size: 1.5rem;
      }

      #top5 li {
        font-size: 1.1rem;
      }

      #nameInput input {
        width: 250px;
        max-width: 90%;
      }

      .success-message {
        font-size: 1.4rem;
      }

      img:hover {
        transform: scale(1.1); /* Ajuste para mobile */
      }
    }

    .rastro {
      position: absolute;
      width: 100px;
      height: 350px;
      background: linear-gradient(to top, rgba(255, 230, 100, 0), rgba(0, 139, 255, 0.8), rgba(255, 50, 50, 1));
      border-radius: 100px 100px 50px 50px;
      filter: blur(120px);
      z-index: 6;
      opacity: 1;
      animation: pulsoRastro 1s ease-in-out infinite;
      pointer-events: none;
    }

    .rastro-core {
      position: absolute;
      width: 20px;
      height: 300px;
      background: linear-gradient(to top, rgba(50, 194, 255, 0.79), rgba(255, 4, 4, 1));
      border-radius: 40px;
      filter: blur(40px);
      z-index: 6;
      opacity: 1;
      animation: pulsoRastroCore 0.5s ease-in-out infinite;
      pointer-events: none;
    }

    /* Estilos para o Modal de Valores (scroll lateral) */
    .amount-modal {
      display: none;
      position: fixed;
      z-index: 30;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      animation: fadeIn 0.3s ease-out;
    }

    .amount-modal-content {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      margin: 10% auto;
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 800px;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: slideIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      position: absolute;
      right: 20px;
      top: 15px;
      transition: all 0.3s ease;
      z-index: 5;
    }

    .close:hover,
    .close:focus {
      color: white;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      transform: scale(1.1);
    }

    .amount-modal h2 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 1.8rem;
      color: white;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      letter-spacing: 1px;
    }

    .amount-modal p {
      text-align: center;
      color: #ccc;
      margin-bottom: 20px;
      font-size: 1.1rem;
    }

    .amount-buttons {
      display: flex;
      flex-direction: row;
      overflow-x: auto;
      gap: 10px;
      margin-top: 10px;
      width: 100%;
      height: auto;
      padding: 10px 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
    }

    .amount-buttons::-webkit-scrollbar {
      height: 6px;
    }

    .amount-buttons::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 3px;
    }

    .amount-buttons::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
    }

    .amount-buttons::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    .amount-button {
      background: linear-gradient(45deg, #28a745, #20c997);
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 180px;
      flex-shrink: 0;
      white-space: nowrap;
      padding: 12px 16px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: 600;
      color: white;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .amount-button:hover {
      box-shadow: 0 8px 25px rgba(40, 167, 69, 0.4);
      transform: translateY(-2px) scale(1.05);
      background: linear-gradient(45deg, #20c997, #28a745);
    }

    /* Container para a notificação com logo voando */
    .notification-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .notification-container.show {
      display: flex;
    }

    /* Fundo escuro borrado durante a exibição da mensagem */
    .notification-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      opacity: 0;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>
  <!-- truncated for length in this simulation - in real call full content would be used -->
  <p id="text1">Avalie o serviço da IndaiaFibra</p>
  <p id="text2">Sua opinião positiva ajuda outras pessoas!</p>
</body>
</html>
